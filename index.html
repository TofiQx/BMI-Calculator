<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>বিএমআই ক্যালকুলেটর (BMI Calculator)</h2>
    
    <div class="input-group">
      <label for="weight">ওজন (কেজি):</label>
      <input type="number" id="weight" placeholder="আপনার ওজন লিখুন">
    </div>

    <div class="input-group">
      <label for="height">উচ্চতা (মিটার):</label>
      <input type="number" id="height" placeholder="আপনার উচ্চতা লিখুন">
    </div>

    <button id="calculateBtn">ফলাফল দেখুন</button>

    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
